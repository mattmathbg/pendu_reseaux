services:
  server:
    build: .
    container_name: pendu_server
    command: ["python", "-m", "server.server", "--port", "8888", "--tls", "--name", "Serveur Pendu Docker"]
    ports:
      - "8888:8888"
      - "8889:8889/udp"
    volumes:
      - ./certs:/app/certs
    networks:
      - pendu
    restart: unless-stopped

networks:
  pendu:
    name: pendu_bridge
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef::/64