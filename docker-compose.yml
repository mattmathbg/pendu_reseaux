services:
  server:
    build: .
    container_name: pendu_server
    command: ["python", "-m", "server.server", "--host", "0.0.0.0", "--port", "8888"]
    ports:
      - "8888:8888"
    networks:
      - pendu
    restart: unless-stopped

  client_1:
    build: .
    container_name: pendu_client_1
    # "server" est résolu automatiquement par le serveur DNS intégré de Docker !
    command: ["python", "-m", "client.cli", "--host", "server", "--port", "8888"]
    stdin_open: true
    tty: true
    depends_on:
      - server
    networks:
      - pendu
    profiles:
      - cli

  client_2:
    build: .
    container_name: pendu_client_2
    command: ["python", "-m", "client.cli", "--host", "server", "--port", "8888"]
    stdin_open: true
    tty: true
    depends_on:
      - server
    networks:
      - pendu
    profiles:
      - cli

networks:
  pendu:
    name: pendu_bridge
    driver: bridge