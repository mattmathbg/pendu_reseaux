services:
  server:
    build: .
    container_name: pendu_server
    command: ["python", "-m", "server.server", "--host", "0.0.0.0", "--port", "8888"]
    ports:
      - "8888:8888"
    networks:
      - pendu
    restart: unless-stopped

networks:
  pendu:
    name: pendu_bridge
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef::/64